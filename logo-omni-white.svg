<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 78" fill="none" style="display: block; width: 100%; height: 100%;">
  <defs>
    <linearGradient id="omniWhiteBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <linearGradient id="mWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Group: OM Logo Mark -->
  <g transform="translate(6, 11)">
    <!-- Stylized 'O' Outer Swirl -->
    <path d="M 28,4 C 14.5,4 4,14.5 4,28 C 4,41.5 14.5,52 28,52 C 37,52 44.8,47 49,39.5 C 46,41.8 42,43 38,42 C 29.5,40 22.5,33 22.5,24 C 22.5,15.5 29.5,8.5 38,8.5 C 43,8.5 47,10.8 49.5,14.2 C 45.5,8 37.5,4 28,4 Z" fill="url(#omniWhiteBlueGrad)" />
    
    <!-- Matrix Sphere Dots -->
    <g fill="#00d2ff" opacity="0.9">
      <circle cx="27" cy="19" r="1.6" />
      <circle cx="31" cy="20" r="1.8" />
      <circle cx="23" cy="24" r="1.6" />
      <circle cx="27" cy="24" r="2.3" fill="#ffffff" />
      <circle cx="32" cy="25" r="2.4" fill="#60a5fa" />
      <circle cx="36" cy="26" r="1.8" />
      <circle cx="23" cy="28" r="1.9" />
      <circle cx="27" cy="29" r="2.5" fill="#ffffff" />
      <circle cx="33" cy="30" r="2.3" />
      <circle cx="37" cy="31" r="1.8" />
      <circle cx="25" cy="34" r="1.8" />
      <circle cx="29" cy="35" r="2.2" fill="#60a5fa" />
      <circle cx="34" cy="36" r="1.7" />
      <circle cx="28" cy="40" r="1.5" />
    </g>

    <!-- Stylized 'M' Facets -->
    <path d="M 48,4 L 57,4 L 68,24 L 79,4 L 88,4 L 88,52 L 80,52 L 80,18 L 70,36 L 66,36 L 56,18 L 56,52 L 48,52 Z" fill="url(#mWhiteGrad)" />
    <path d="M 68,24 L 79,4 L 88,4 L 88,52 L 80,52 L 80,18 Z" fill="#00d2ff" opacity="0.85" />
  </g>

  <!-- Typography: Horizontal Brand Lockup -->
  <!-- "OmniMatrix" in Crisp White & Cyan -->
  <text x="108" y="34" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">Omni<tspan fill="#38bdf8">Matrix</tspan></text>

  <!-- Subtitle 1: "TECHNOLOGIES PVT. LTD." -->
  <text x="109" y="49" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#94a3b8" letter-spacing="2.6px">TECHNOLOGIES PVT. LTD.</text>
  
  <!-- Subtitle 2: Tagline "INNOVATE | INTEGRATE | TRANSFORM" in Cyan Accent -->
  <text x="109" y="64" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8.5" font-weight="800" fill="#38bdf8" letter-spacing="1.5px">INNOVATE  |  INTEGRATE  |  TRANSFORM</text>
</svg>
