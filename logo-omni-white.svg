<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" fill="none" style="display: block; width: 100%; height: 100%;">
  <defs>
    <linearGradient id="omniWhiteBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <linearGradient id="mWhiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Group: OM Logo Mark -->
  <g transform="translate(4, 6)">
    <!-- Stylized 'O' Outer Swirl -->
    <path d="M 26,4 C 13.85,4 4,13.85 4,26 C 4,38.15 13.85,48 26,48 C 34.2,48 41.3,43.5 45.1,36.8 C 42.5,38.8 38.8,40 35,39 C 27.5,37 21,30.5 21,22 C 21,14.5 27,8 35,8 C 39.5,8 43,10 45.5,13.2 C 41.8,7.6 34.4,4 26,4 Z" fill="url(#omniWhiteBlueGrad)" />
    
    <!-- Matrix Sphere Dots -->
    <g fill="#00d2ff" opacity="0.9">
      <circle cx="25" cy="18" r="1.5" />
      <circle cx="29" cy="19" r="1.6" />
      <circle cx="21" cy="22" r="1.5" />
      <circle cx="25" cy="22" r="2.1" fill="#ffffff" />
      <circle cx="29" cy="23" r="2.2" />
      <circle cx="33" cy="24" r="1.7" />
      <circle cx="21" cy="26" r="1.8" />
      <circle cx="25" cy="27" r="2.4" fill="#ffffff" />
      <circle cx="30" cy="28" r="2.2" />
      <circle cx="34" cy="29" r="1.6" />
      <circle cx="23" cy="31" r="1.7" />
      <circle cx="27" cy="32" r="2.1" fill="#ffffff" />
      <circle cx="31" cy="33" r="1.6" />
      <circle cx="26" cy="36" r="1.4" />
    </g>

    <!-- Stylized 'M' Facets -->
    <path d="M 44,4 L 52,4 L 62,22 L 72,4 L 80,4 L 80,48 L 73,48 L 73,16 L 64,32 L 60,32 L 51,16 L 51,48 L 44,48 Z" fill="url(#mWhiteGrad)" />
    <path d="M 62,22 L 72,4 L 80,4 L 80,48 L 73,48 L 73,16 Z" fill="#00d2ff" opacity="0.8" />
  </g>

  <!-- Typography: Horizontal Brand Lockup -->
  <!-- "Omni" in Crisp White Bold -->
  <text x="96" y="35" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5px">Omni<tspan fill="#38bdf8">Matrix</tspan></text>

  <!-- Subtitle: "TECHNOLOGIES" -->
  <text x="97" y="49" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="8" font-weight="700" fill="#94a3b8" letter-spacing="2.8px">TECHNOLOGIES PVT LTD</text>
  
  <!-- Subtle tech divider accent -->
  <line x1="97" y1="40" x2="260" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="0.75" />
</svg>
